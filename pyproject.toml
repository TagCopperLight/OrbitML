[project]
name = "orbitml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "sgp4>=2.27",
    "torch>=2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
